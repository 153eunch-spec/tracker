<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="증상 기록">
<meta name="mobile-web-app-capable" content="yes">
<title>증상 기록 트래커</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2F6459">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#F1F5F3;
    --surface:#FFFFFF;
    --surface-2:#E7EFEC;
    --ink:#1E2B29;
    --muted:#6E807C;
    --line:#D7E2DE;
    --primary:#2F6459;
    --primary-soft:#DCEAE6;
    --accent:#8B4B6B;
    --g1:#6B9B6E;
    --g2:#C98A2D;
    --g3:#B84C4C;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 48px;
  }

  /* Header */
  .head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .head h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .head .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .datebar{
    display:flex;
    align-items:center;
    gap:10px;
    margin:14px 0 22px;
  }
  .datebar button{
    width:34px;height:34px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--primary);
    font-size:16px;
    cursor:pointer;
  }
  .datebar button:active{ transform:scale(0.94); }
  .datebar .date-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:7px 12px;
    flex:1;
    text-align:center;
  }
  .datebar .today-btn{
    width:auto;
    padding:0 12px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:12px;
  }

  /* Pulse strip - signature element */
  .pulse-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px 12px;
    margin-bottom:18px;
  }
  .pulse-title{
    font-size:11px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.06em;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }
  .pulse-track{
    position:relative;
    height:34px;
    border-bottom:1.5px solid var(--line);
  }
  .pulse-hour-tick{
    position:absolute;
    bottom:0;
    width:1px;
    height:5px;
    background:var(--line);
  }
  .pulse-dot{
    position:absolute;
    bottom:2px;
    width:9px;height:9px;
    border-radius:50%;
    transform:translateX(-50%);
    border:2px solid var(--surface);
    box-shadow:0 0 0 1px rgba(0,0,0,0.06);
  }
  .pulse-empty{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    padding:8px 0 4px;
  }

  /* Symptom chips */
  .section-label{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--primary);
    margin:4px 0 10px;
  }
  .chip-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-bottom:18px;
  }
  .chip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:11px;
    padding:11px 6px;
    text-align:center;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    line-height:1.3;
    user-select:none;
    transition:background 0.12s, border-color 0.12s;
  }
  .chip .code{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--muted);
    margin-top:2px;
  }
  .chip:active{ transform:scale(0.97); }
  .chip.selected{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  .chip.selected .code{ color:var(--primary-soft); }

  /* Record panel */
  .panel{
    background:var(--surface);
    border:1.5px solid var(--primary);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:18px;
    display:none;
  }
  .panel.open{ display:block; }
  .panel .panel-title{
    font-weight:700;
    font-size:15px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .panel .panel-title button{
    border:none;background:none;color:var(--muted);font-size:13px;cursor:pointer;
  }
  .row-label{
    font-size:11px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.05em;
    margin:10px 0 6px;
  }
  .pill-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .pill{
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:999px;
    padding:6px 12px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .pill.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .grade-row .pill.selected[data-grade="G1"]{ background:var(--g1); border-color:var(--g1); }
  .grade-row .pill.selected[data-grade="G2"]{ background:var(--g2); border-color:var(--g2); }
  .grade-row .pill.selected[data-grade="G3"]{ background:var(--g3); border-color:var(--g3); }

  .note-input{
    width:100%;
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 10px;
    font-size:13px;
    font-family:'Noto Sans KR', sans-serif;
    margin-top:2px;
  }
  .add-btn{
    width:100%;
    margin-top:14px;
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:11px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .add-btn:active{ transform:scale(0.98); }

  /* Log table */
  .log-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:14px;
  }
  .log-row{
    display:grid;
    grid-template-columns:52px 1fr 26px;
    gap:8px;
    align-items:start;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  .log-row:last-child{ border-bottom:none; }
  .log-time{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    padding-top:2px;
  }
  .log-content .log-label{
    font-size:13px;
    font-weight:700;
  }
  .log-content .log-detail{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .log-del{
    border:none;
    background:none;
    color:var(--muted);
    font-size:15px;
    cursor:pointer;
    padding-top:1px;
  }
  .log-empty{
    padding:26px 12px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  .export-row{
    display:flex;
    gap:8px;
  }
  .export-btn{
    flex:1;
    background:var(--surface);
    border:1px solid var(--primary);
    color:var(--primary);
    border-radius:10px;
    padding:10px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .export-btn.copied{
    background:var(--primary);
    color:#fff;
  }

  .foot-note{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:16px;
    line-height:1.6;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(30,43,41,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-box{
    background:var(--surface);
    width:100%;
    max-width:640px;
    border-radius:16px 16px 0 0;
    padding:18px 16px 22px;
  }
  .modal-title{
    font-weight:700;
    font-size:14px;
    margin-bottom:8px;
  }
  .modal-hint{
    font-size:12px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .modal-textarea{
    width:100%;
    min-height:160px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    resize:vertical;
    margin-bottom:12px;
  }
  .modal-actions{
    display:flex;
    gap:8px;
  }
  .modal-actions button{
    flex:1;
    border-radius:10px;
    padding:10px;
    font-size:13px;
    font-weight:700;
    font-family:'Noto Sans KR', sans-serif;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
  }
  .modal-actions .primary{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>증상 기록</h1>
    <span class="eyebrow" id="entryCount">0건</span>
  </div>
  <div class="datebar">
    <button id="prevDay">‹</button>
    <div class="date-label" id="dateLabel">-</div>
    <button id="nextDay">›</button>
    <button class="today-btn" id="todayBtn">오늘</button>
  </div>

  <div class="pulse-card">
    <div class="pulse-title"><span>오늘의 파동</span><span id="pulseHint">기록 없음</span></div>
    <div class="pulse-track" id="pulseTrack"></div>
  </div>

  <div class="section-label">항목 선택</div>
  <div class="chip-grid" id="chipGrid"></div>

  <div class="panel" id="panel">
    <div class="panel-title">
      <span id="panelSymptomName">-</span>
      <button id="panelClose">닫기</button>
    </div>

    <div class="row-label">경과</div>
    <div class="pill-row" id="patternRow"></div>

    <div class="row-label">등급 (선택)</div>
    <div class="pill-row grade-row" id="gradeRow"></div>

    <div class="row-label">메모 (선택)</div>
    <input type="text" class="note-input" id="noteInput" placeholder="예: 무릎, 손발 등">

    <button class="add-btn" id="addBtn">기록 추가</button>
  </div>

  <div class="section-label">오늘 기록</div>
  <div class="log-card" id="logCard"></div>

  <div class="export-row">
    <button class="export-btn" id="copyRows">행별로 복사 (표 붙여넣기용)</button>
    <button class="export-btn" id="copySummary">한 줄 요약 복사</button>
  </div>

  <button class="export-btn" id="copyWeek" style="width:100%; margin-top:8px;">이번 주 전체 복사 (일~토, 7일치)</button>

  <div class="foot-note">기록은 이 브라우저에 저장됩니다. 스프레드시트에는 복사한 내용을 붙여넣어 사용하세요.</div>
</div>

<div id="modalRoot"></div>

<script>
const SYMPTOMS = [
  {label:'발열', code:'Fever'},
  {label:'오심/구토', code:'N/V'},
  {label:'설사', code:'Diarrhea'},
  {label:'변비', code:'Constipation'},
  {label:'식욕부진', code:'Appetite↓'},
  {label:'관절통', code:'Arthralgia'},
  {label:'근육통', code:'Myalgia'},
  {label:'저림(PN)', code:'PN'},
  {label:'피로감', code:'Fatigue'},
  {label:'부종', code:'Edema'},
  {label:'혈뇨', code:'Hematuria'},
  {label:'수면', code:'Sleep'},
  {label:'통증', code:'Pain'},
  {label:'+ 기타', code:'custom'}
];

const PATTERNS = [
  {label:'간헐적', code:'int.'},
  {label:'지속적', code:'persistent'},
  {label:'신규발생', code:'new(+)'},
  {label:'호전', code:'improved'},
  {label:'악화', code:'aggravated'},
  {label:'소실', code:'resolved'},
  {label:'변동없음', code:'stable'}
];

const GRADES = ['G1','G2','G3'];
const GRADE_COLOR = {G1:'#6B9B6E', G2:'#C98A2D', G3:'#B84C4C'};

let currentDate = new Date();
let selectedSymptom = null;
let selectedPattern = null;
let selectedGrade = null;
let customLabel = null;
let entries = [];

function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateDisplay(d){
  const wd=['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${wd})`;
}
function isToday(d){ return dateKey(d)===dateKey(new Date()); }

function renderChips(){
  const grid = document.getElementById('chipGrid');
  grid.innerHTML = '';
  SYMPTOMS.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'chip' + (selectedSymptom && selectedSymptom.label===s.label ? ' selected':'');
    el.innerHTML = `${s.label}${s.code!=='custom' ? `<span class="code">${s.code}</span>`:''}`;
    el.onclick = ()=>selectSymptom(s);
    grid.appendChild(el);
  });
}

function selectSymptom(s){
  if(s.code==='custom'){
    const name = prompt('항목 이름을 입력하세요 (예: 두통)');
    if(!name) return;
    customLabel = name;
    selectedSymptom = {label:name, code:name};
  } else {
    customLabel = null;
    selectedSymptom = s;
  }
  selectedPattern = null;
  selectedGrade = null;
  document.getElementById('noteInput').value = '';
  renderChips();
  openPanel();
}

function openPanel(){
  document.getElementById('panel').classList.add('open');
  document.getElementById('panelSymptomName').textContent = selectedSymptom.label;
  renderPatternRow();
  renderGradeRow();
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  selectedSymptom = null;
  renderChips();
}

function renderPatternRow(){
  const row = document.getElementById('patternRow');
  row.innerHTML = '';
  PATTERNS.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'pill' + (selectedPattern && selectedPattern.code===p.code ? ' selected':'');
    el.textContent = p.label;
    el.onclick = ()=>{ selectedPattern = p; renderPatternRow(); };
    row.appendChild(el);
  });
}
function renderGradeRow(){
  const row = document.getElementById('gradeRow');
  row.innerHTML = '';
  GRADES.forEach(g=>{
    const el = document.createElement('div');
    el.className = 'pill' + (selectedGrade===g ? ' selected':'');
    el.dataset.grade = g;
    el.textContent = g;
    el.onclick = ()=>{ selectedGrade = (selectedGrade===g ? null : g); renderGradeRow(); };
    row.appendChild(el);
  });
}

async function addEntry(){
  if(!selectedSymptom){ return; }
  if(!selectedPattern){ alert('경과를 선택해주세요.'); return; }
  const note = document.getElementById('noteInput').value.trim();
  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  let codeStr = selectedSymptom.code;
  if(note) codeStr += `(${note})`;
  if(selectedGrade) codeStr += ` ${selectedGrade}`;
  codeStr += ` ${selectedPattern.code}`;

  const entry = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    time,
    label: selectedSymptom.label,
    detail: codeStr,
    grade: selectedGrade
  };
  entries.unshift(entry);
  await saveEntries();
  closePanel();
  renderLog();
  renderPulse();
}

async function deleteEntry(id){
  entries = entries.filter(e=>e.id!==id);
  await saveEntries();
  renderLog();
  renderPulse();
}

function renderLog(){
  const card = document.getElementById('logCard');
  document.getElementById('entryCount').textContent = `${entries.length}건`;
  if(entries.length===0){
    card.innerHTML = `<div class="log-empty">아직 기록이 없습니다. 위에서 항목을 선택해 추가하세요.</div>`;
    return;
  }
  card.innerHTML = '';
  entries.forEach(e=>{
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = `
      <div class="log-time">${e.time}</div>
      <div class="log-content">
        <div class="log-label">${e.label}</div>
        <div class="log-detail">${e.detail}</div>
      </div>
      <button class="log-del" data-id="${e.id}">✕</button>
    `;
    row.querySelector('.log-del').onclick = ()=>deleteEntry(e.id);
    card.appendChild(row);
  });
}

function renderPulse(){
  const track = document.getElementById('pulseTrack');
  const hint = document.getElementById('pulseHint');
  track.querySelectorAll('.pulse-dot, .pulse-hour-tick').forEach(n=>n.remove());
  for(let h=0; h<=24; h+=4){
    const tick = document.createElement('div');
    tick.className = 'pulse-hour-tick';
    tick.style.left = (h/24*100)+'%';
    track.appendChild(tick);
  }
  if(entries.length===0){
    hint.textContent = '기록 없음';
    return;
  }
  hint.textContent = `${entries.length}건 기록됨`;
  entries.forEach(e=>{
    const [hh,mm] = e.time.split(':').map(Number);
    const pct = ((hh*60+mm)/(24*60))*100;
    const dot = document.createElement('div');
    dot.className = 'pulse-dot';
    dot.style.left = pct+'%';
    dot.style.background = GRADE_COLOR[e.grade] || 'var(--primary)';
    dot.title = `${e.time} ${e.label}`;
    track.appendChild(dot);
  });
}

async function loadEntries(){
  const key = 'entries:' + dateKey(currentDate);
  try{
    const raw = localStorage.getItem(key);
    entries = raw ? JSON.parse(raw) : [];
  }catch(err){
    entries = [];
  }
  renderLog();
  renderPulse();
}

async function saveEntries(){
  const key = 'entries:' + dateKey(currentDate);
  try{
    localStorage.setItem(key, JSON.stringify(entries));
  }catch(err){
    console.error('저장 실패', err);
    alert('저장에 실패했습니다. 기기 저장공간을 확인해주세요.');
  }
}

function renderDateBar(){
  document.getElementById('dateLabel').textContent = dateDisplay(currentDate);
  document.getElementById('todayBtn').style.display = isToday(currentDate) ? 'none' : 'block';
}

async function changeDate(delta){
  currentDate.setDate(currentDate.getDate()+delta);
  currentDate = new Date(currentDate);
  renderDateBar();
  await loadEntries();
}

document.getElementById('prevDay').onclick = ()=>changeDate(-1);
document.getElementById('nextDay').onclick = ()=>changeDate(1);
document.getElementById('todayBtn').onclick = async ()=>{
  currentDate = new Date();
  renderDateBar();
  await loadEntries();
};
document.getElementById('panelClose').onclick = closePanel;
document.getElementById('addBtn').onclick = addEntry;

function flashCopied(btn, label){
  const orig = btn.textContent;
  btn.textContent = label;
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
}

function showCopyModal(text, title){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-title">${title}</div>
        <div class="modal-hint">자동 복사가 막혀있어요. 아래 내용을 길게 눌러 전체 선택 후 복사해주세요.</div>
        <textarea class="modal-textarea" id="modalTextarea" readonly></textarea>
        <div class="modal-actions">
          <button id="modalCopyBtn" class="primary">지금 복사 시도</button>
          <button id="modalCloseBtn">닫기</button>
        </div>
      </div>
    </div>
  `;
  const ta = document.getElementById('modalTextarea');
  ta.value = text;
  ta.focus();
  ta.select();
  document.getElementById('modalCloseBtn').onclick = ()=>{ root.innerHTML=''; };
  document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') root.innerHTML=''; };
  document.getElementById('modalCopyBtn').onclick = ()=>{
    ta.focus();
    ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(err){ ok = false; }
    const btn = document.getElementById('modalCopyBtn');
    btn.textContent = ok ? '복사됨 ✓' : '길게 눌러 복사해주세요';
    setTimeout(()=>{ btn.textContent = '지금 복사 시도'; }, 1600);
  };
}

async function copyText(text, btn, successLabel, modalTitle){
  // 1) Clipboard API
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      flashCopied(btn, successLabel);
      return;
    }
  }catch(err){ /* fall through */ }

  // 2) execCommand fallback via hidden textarea
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok){ flashCopied(btn, successLabel); return; }
  }catch(err){ /* fall through */ }

  // 3) Show modal so user can copy manually
  showCopyModal(text, modalTitle);
}

document.getElementById('copyRows').onclick = async ()=>{
  if(entries.length===0){ alert('복사할 기록이 없습니다.'); return; }
  const d = dateKey(currentDate);
  const lines = entries.slice().reverse().map(e=>`${d}\t${e.time}\t${e.label}\t${e.detail}`).join('\n');
  await copyText(lines, document.getElementById('copyRows'), '복사됨 ✓', '오늘 기록 (표 붙여넣기용)');
};

document.getElementById('copySummary').onclick = async ()=>{
  if(entries.length===0){ alert('복사할 기록이 없습니다.'); return; }
  const summary = entries.slice().reverse().map(e=>e.detail).join('; ');
  await copyText(summary, document.getElementById('copySummary'), '복사됨 ✓', '오늘 한 줄 요약');
};

function getWeekDates(d){
  const base = new Date(d);
  const sunday = new Date(base);
  sunday.setDate(base.getDate() - base.getDay()); // back to Sunday
  const dates = [];
  for(let i=0;i<7;i++){
    const dd = new Date(sunday);
    dd.setDate(sunday.getDate()+i);
    dates.push(dd);
  }
  return dates;
}

async function loadEntriesForDate(d){
  const key = 'entries:' + dateKey(d);
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  }catch(err){
    return [];
  }
}

document.getElementById('copyWeek').onclick = async ()=>{
  const btn = document.getElementById('copyWeek');
  const weekDates = getWeekDates(currentDate);
  let lines = [];
  let totalCount = 0;
  for(const d of weekDates){
    const dayEntries = await loadEntriesForDate(d);
    if(dayEntries.length===0) continue;
    const dk = dateKey(d);
    dayEntries.slice().reverse().forEach(e=>{
      lines.push(`${dk}\t${e.time}\t${e.label}\t${e.detail}`);
      totalCount++;
    });
  }
  if(totalCount===0){
    alert('이번 주에 기록된 내용이 없습니다.');
    return;
  }
  await copyText(lines.join('\n'), btn, `복사됨 ✓ (${totalCount}건)`, `이번 주 기록 (${totalCount}건)`);
};
